<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist de Conferência — Sinistros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0A0A0A;
    --white:#FAF9F6;
    --paper:#FFFFFF;
    --orange:#F2600C;
    --orange-dark:#B8440A;
    --orange-tint:#FDE6D3;
    --orange-tint-2:#FFF1E4;
    --gray-line:#E4E1D8;
    --gray-text:#5B5850;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--black);
    font-family:'Inter',sans-serif;
    color:var(--black);
  }
  .page{
    max-width:980px;
    margin:0 auto;
    background:var(--white);
  }

  /* ===== HEADER ===== */
  header{
    background:var(--black);
    color:var(--white);
    padding:56px 48px 40px;
    position:relative;
    border-bottom:8px solid var(--orange);
  }
  .eyebrow-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .eyebrow-dot{
    width:10px;height:10px;background:var(--orange);
  }
  .eyebrow{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    letter-spacing:0.08em;
    font-size:13px;
    color:var(--orange);
  }
  h1{
    font-family:'Archivo Black',sans-serif;
    font-size:44px;
    line-height:1.05;
    margin:0 0 12px;
    max-width:640px;
  }
  header p.sub{
    font-family:'Barlow Condensed',sans-serif;
    font-size:19px;
    color:#D8D6CE;
    max-width:560px;
    margin:0;
    font-weight:500;
  }
  .header-index{
    position:absolute;
    right:48px;
    bottom:40px;
    display:flex;
    gap:22px;
  }
  .header-index span{
    display:block;
    font-family:'Barlow Condensed',sans-serif;
    font-size:12px;
    color:#9A968A;
    letter-spacing:0.06em;
  }
  .header-index strong{
    display:block;
    font-family:'Archivo Black',sans-serif;
    font-size:26px;
    color:var(--orange);
  }
  @media(max-width:760px){
    .header-index{display:none;}
    h1{font-size:32px;}
    header{padding:40px 24px 32px;}
  }

  /* ===== NAV (print: hidden, screen: sticky) ===== */
  nav.tabs{
    display:flex;
    background:var(--black);
    border-bottom:1px solid #2A2A2A;
    overflow-x:auto;
    position:sticky;
    top:0;
    z-index:10;
  }
  nav.tabs button{
    flex:1 0 auto;
    background:transparent;
    border:none;
    color:#B9B6AC;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.02em;
    padding:16px 18px;
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{
    color:var(--white);
    border-bottom-color:var(--orange);
    background:#151412;
  }
  nav.tabs button:hover{color:var(--white);}

  /* ===== MAIN ===== */
  main{padding:44px 48px 70px;}
  @media(max-width:760px){ main{padding:32px 22px 56px;} }

  .category{display:none;}
  .category.active{display:block;}

  .cat-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom:28px;
    padding-bottom:20px;
    border-bottom:2px solid var(--black);
  }
  .cat-head h2{
    font-family:'Archivo Black',sans-serif;
    font-size:30px;
    margin:0;
  }
  .cat-head .desc{
    font-size:14.5px;
    color:var(--gray-text);
    margin-top:8px;
    max-width:460px;
  }
  .progress-wrap{min-width:180px;text-align:right;}
  .progress-label{
    font-family:'Barlow Condensed',sans-serif;
    font-size:13px;
    color:var(--gray-text);
    margin-bottom:6px;
  }
  .progress-label b{color:var(--black);font-size:15px;}
  .progress-bar{
    width:180px;height:8px;background:var(--gray-line);
    position:relative;
  }
  .progress-fill{
    height:100%;background:var(--orange);width:0%;
    transition:width .25s ease;
  }

  .flag-box{
    display:flex;
    gap:16px;
    align-items:flex-start;
    background:var(--black);
    color:var(--white);
    padding:18px 22px;
    margin-bottom:32px;
  }
  .flag-box .flag-icon{
    flex:none;
    width:34px;height:34px;
    background:var(--orange);
    color:var(--black);
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black',sans-serif;
    font-size:18px;
  }
  .flag-box .flag-text{
    font-family:'Barlow Condensed',sans-serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:0.01em;
    padding-top:4px;
  }
  .flag-box .flag-sub{
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:#C9C6BC;
    margin-top:3px;
    font-weight:400;
  }

  .block{margin-bottom:36px;}
  .block-title{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .block-num{
    font-family:'Archivo Black',sans-serif;
    font-size:14px;
    color:var(--paper);
    background:var(--black);
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .block-title h3{
    font-family:'Barlow Condensed',sans-serif;
    font-size:22px;
    font-weight:700;
    margin:0;
    text-transform:uppercase;
    letter-spacing:0.01em;
  }
  .block-title .tag{
    font-size:11.5px;
    color:var(--orange-dark);
    background:var(--orange-tint);
    padding:3px 9px;
    font-family:'Inter',sans-serif;
    font-weight:600;
  }

  .items{border-top:1px solid var(--gray-line);}
  .item{
    display:flex;
    gap:16px;
    padding:15px 4px;
    border-bottom:1px solid var(--gray-line);
    cursor:pointer;
  }
  .item:hover{background:var(--orange-tint-2);}
  .item .box{
    flex:none;
    width:22px;height:22px;
    border:2px solid var(--black);
    margin-top:2px;
    position:relative;
  }
  .item.checked .box{
    background:var(--orange);
    border-color:var(--orange);
  }
  .item.checked .box::after{
    content:"";
    position:absolute;
    left:5px;top:1px;
    width:6px;height:11px;
    border:solid var(--black);
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  .item-text{flex:1;}
  .item-title{
    font-size:15px;
    font-weight:600;
    color:var(--black);
    margin-bottom:3px;
  }
  .item.checked .item-title{
    color:var(--gray-text);
    text-decoration:line-through;
    text-decoration-color:var(--orange-dark);
  }
  .item-detail{
    font-size:13.5px;
    color:var(--gray-text);
    line-height:1.5;
  }

  .status-note{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--orange);
    color:var(--black);
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.02em;
    padding:6px 12px;
    margin:2px 0;
  }

  .foot-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:48px;
    padding-top:24px;
    border-top:1px solid var(--gray-line);
  }
  .reset-btn{
    background:none;
    border:1.5px solid var(--black);
    color:var(--black);
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 18px;
    cursor:pointer;
  }
  .reset-btn:hover{background:var(--black);color:var(--white);}
  .print-note{
    font-size:12.5px;
    color:var(--gray-text);
  }

  @media print{
    body{background:var(--white);}
    nav.tabs{display:none;}
    .category{display:block !important;page-break-before:always;}
    .category:first-of-type{page-break-before:auto;}
    .foot-actions{display:none;}
    .item{cursor:default;}
    header{border-bottom:6px solid var(--orange);}
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="eyebrow-row">
      <span class="eyebrow-dot"></span>
      <span class="eyebrow">Abertura de eventos · Base de conferência</span>
    </div>
    <h1>Checklist de conferência</h1>
    <p class="sub">Guia de apoio para revisão de eventos antes do envio do link e após a análise, por tipo de acionamento.</p>
    <div class="header-index">
      <div><strong id="cat-count">5</strong><span>categorias</span></div>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="main"></main>

</div>

<script>
const DATA = [
  {
    id: "colisao",
    label: "Colisão",
    desc: "Conferência completa do evento de colisão, com ou sem envolvimento de terceiro.",
    before: [
      { t: "Verificar se possui o benefício", d: "Confirmar a cobertura antes de gerar e enviar o link ao associado." }
    ],
    duringTitle: "Conferir no link",
    during: [
      { t: "CNH", d: "Não pode estar vencida. Se houver terceiro, é necessário anexar a CNH de ambos os condutores." },
      { t: "CRLV", d: "Documento a partir de 2023. Se houver terceiro, é necessário o CRLV de ambos os veículos." },
      { t: "Contato", d: "Confirmar e atualizar o contato de telefone do associado." },
      { t: "Termo(s) assinado(s)", d: "Assinado pelo associado e, se houver terceiro, também pelo condutor do veículo do terceiro." },
      { t: "Boletim de Ocorrência", d: "Exigido em casos de fluxo normal." },
      { t: "Narrativa completa", d: "Relato detalhado de como o evento aconteceu." },
      { t: "Tacógrafo", d: "Necessário em caso de caminhão." },
      { t: "Prints", d: "Contrato, rastreador, confirmação da abertura e acionamento anterior." }
    ],
    afterTitle: "Após a análise dos documentos",
    after: [
      { t: "Cota de participação", d: "Verificar no contrato: cota fixa ou calcular com base na FIPE do mês." },
      { t: "Observações", d: "Registrar cota, data finalizada e se o veículo já está em alguma oficina." },
      { t: "Status", d: "Alterar status para LIBERADO P/ CADASTRO.", flag: true },
      { t: "Envio final", d: "Enviar fluxograma, informações, orientações e taxa de acionamento." }
    ]
  },
  {
    id: "terceiro",
    label: "Inclusão de terceiro",
    desc: "Inclusão de um terceiro em um evento de colisão que já está aberto.",
    before: [
      { t: "Verificar se possui o benefício", d: "Confirmar a cobertura antes de gerar e enviar o link ao associado." }
    ],
    duringTitle: "Conferir no link",
    during: [
      { t: "CNH do terceiro", d: "Não pode estar vencida." },
      { t: "CRLV do terceiro", d: "Documento a partir de 2023." },
      { t: "Abertura no link", d: "Alterar a abertura do evento para ambos os envolvidos." },
      { t: "Termo do terceiro", d: "Deve estar assinado." },
      { t: "Tacógrafo", d: "Necessário em caso de caminhão." },
      { t: "Prints", d: "Confirmação de inclusão do terceiro no evento." }
    ],
    afterTitle: "Após a análise dos documentos",
    after: [
      { t: "Observações", d: "Registrar \"Inclusão de terceiro\", a data realizada da inclusão e se o terceiro já está em alguma oficina." },
      { t: "Formulário", d: "Enviar no formulário de Inclusão do Terceiro." },
      { t: "Orientações", d: "Passar informações e orientações ao associado." }
    ]
  },
  {
    id: "roubofurto",
    label: "Roubo / furto",
    desc: "Conferência completa do evento de roubo ou furto de veículo.",
    before: [
      { t: "Verificar se possui o benefício", d: "Confirmar a cobertura antes de gerar e enviar o link ao associado." }
    ],
    duringTitle: "Conferir no link",
    during: [
      { t: "CNH", d: "Não pode estar vencida." },
      { t: "CRLV", d: "Documento a partir de 2023." },
      { t: "Contato", d: "Confirmar e atualizar o contato de telefone do associado." },
      { t: "Termo(s) assinado(s)", d: "Assinado pelo associado." },
      { t: "Boletim de Ocorrência", d: "Obrigatório em todos os casos.", flag: true },
      { t: "Narrativa completa", d: "Relato detalhado de como o evento aconteceu." },
      { t: "Prints", d: "Contrato, rastreador, confirmação da abertura e acionamento anterior." }
    ],
    afterTitle: "Após a análise dos documentos",
    after: [
      { t: "Cota de participação", d: "Verificar no contrato: cota fixa ou calcular com base na FIPE do mês." },
      { t: "Observações", d: "Registrar cota e data finalizada." },
      { t: "Status", d: "Alterar status para LIBERADO P/ CADASTRO.", flag: true },
      { t: "Envio final", d: "Enviar fluxograma, informações, orientações e taxa de acionamento." }
    ]
  },
  {
    id: "vidros",
    label: "Vidros / periféricos",
    desc: "Conferência de eventos de reparo de vidros e periféricos do veículo.",
    before: [
      { t: "Verificar se possui o benefício", d: "Confirmar a cobertura antes de gerar e enviar o link ao associado." }
    ],
    duringTitle: "Conferir no link",
    during: [
      { t: "CNH", d: "Não pode estar vencida." },
      { t: "CRLV", d: "Documento a partir de 2023." },
      { t: "Contato", d: "Confirmar e atualizar o contato de telefone do associado." },
      { t: "Foto da frente do veículo", d: "Deve mostrar o veículo completo." },
      { t: "Foto da avaria", d: "Deve estar visível." },
      { t: "Foto do interior completa", d: "Necessária em casos de para-brisa ou retrovisor." },
      { t: "Vídeo", d: "Mostrando em um papel a palavra-chave do dia, a avaria, a frente do veículo completo e o chassi na lataria." },
      { t: "Narrativa completa", d: "Relato detalhado de como o evento aconteceu." },
      { t: "Prints", d: "Contrato, rastreador, confirmação da abertura e acionamento anterior." }
    ],
    afterTitle: "Após a análise dos documentos",
    after: [
      { t: "Observações", d: "Registrar qual periférico será reparado e a data finalizada." },
      { t: "Status", d: "Alterar status para LIBERADO P/ CADASTRO.", flag: true },
      { t: "Orientações", d: "Passar informações e orientações ao associado." }
    ]
  },
  {
    id: "carroreserva",
    label: "Carro reserva",
    desc: "Liberação de carro reserva vinculado a um evento de colisão ou roubo/furto.",
    before: [
      { t: "Verificar se possui o benefício", d: "Confirmar a cobertura do carro reserva." },
      { t: "Eventos em aberto", d: "Verificar se existe evento de colisão ou roubo/furto em aberto vinculado." },
      { t: "Etapa no SIGA", d: "Fluxo leve: liberar somente após a autorização. Fluxo normal: liberar somente após a análise." }
    ],
    duringTitle: "Conferir no link",
    during: [
      { t: "CNH", d: "Não pode estar vencida." },
      { t: "CRLV", d: "Documento a partir de 2023." },
      { t: "Contato", d: "Confirmar e atualizar o contato de telefone do associado." },
      { t: "Prints", d: "Benefício, confirmação da abertura e acionamento anterior." }
    ],
    afterTitle: "Após a análise dos documentos",
    after: [
      { t: "Formulário", d: "Enviar no formulário de Carro Reserva." },
      { t: "Orientações", d: "Passar informações e orientações ao associado." }
    ]
  }
];

const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');
const checkedState = {};

function itemRow(catId, group, idx, item){
  const key = catId+'-'+group+'-'+idx;
  const checked = checkedState[key] ? 'checked' : '';
  return `<div class="item ${checked}" data-key="${key}">
    <div class="box"></div>
    <div class="item-text">
      <div class="item-title">${item.t}</div>
      <div class="item-detail">${item.d}</div>
      ${item.flag ? `<span class="status-note">${item.t === 'Status' ? 'LIBERADO P/ CADASTRO' : 'Obrigatório'}</span>` : ''}
    </div>
  </div>`;
}

function renderCategory(cat){
  const beforeItems = cat.before.map((it,i)=>itemRow(cat.id,'before',i,it)).join('');
  const duringItems = cat.during.map((it,i)=>itemRow(cat.id,'during',i,it)).join('');
  const afterItems = cat.after.map((it,i)=>itemRow(cat.id,'after',i,it)).join('');
  return `
  <section class="category" id="cat-${cat.id}" data-id="${cat.id}">
    <div class="cat-head">
      <div>
        <h2>${cat.label}</h2>
        <div class="desc">${cat.desc}</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><b class="pct">0%</b> conferido</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
      </div>
    </div>

    <div class="block">
      <div class="block-title"><div class="block-num">1</div><h3>Antes do envio do link</h3></div>
      <div class="items">${beforeItems}</div>
    </div>

    <div class="block">
      <div class="block-title"><div class="block-num">2</div><h3>${cat.duringTitle}</h3></div>
      <div class="items">${duringItems}</div>
    </div>

    <div class="block">
      <div class="block-title"><div class="block-num">3</div><h3>${cat.afterTitle}</h3></div>
      <div class="items">${afterItems}</div>
    </div>

    <div class="foot-actions">
      <button class="reset-btn" data-reset="${cat.id}">Limpar conferência</button>
      <span class="print-note">Use Ctrl/Cmd + P para imprimir esta categoria</span>
    </div>
  </section>`;
}

tabsEl.innerHTML = DATA.map((c,i)=>`<button data-id="${c.id}" class="${i===0?'active':''}">${c.label}</button>`).join('');
mainEl.innerHTML = DATA.map((c,i)=>{
  const html = renderCategory(c);
  return i===0 ? html.replace('class="category"','class="category active"') : html;
}).join('');

function updateProgress(catId){
  const section = document.getElementById('cat-'+catId);
  const items = section.querySelectorAll('.item');
  const total = items.length;
  let done = 0;
  items.forEach(it=>{ if(it.classList.contains('checked')) done++; });
  const pct = total ? Math.round((done/total)*100) : 0;
  section.querySelector('.pct').textContent = pct + '%';
  section.querySelector('.progress-fill').style.width = pct + '%';
}

mainEl.addEventListener('click', function(e){
  const item = e.target.closest('.item');
  if(item){
    const key = item.getAttribute('data-key');
    checkedState[key] = !checkedState[key];
    item.classList.toggle('checked');
    const catId = item.closest('.category').getAttribute('data-id');
    updateProgress(catId);
    return;
  }
  const resetBtn = e.target.closest('[data-reset]');
  if(resetBtn){
    const catId = resetBtn.getAttribute('data-reset');
    const section = document.getElementById('cat-'+catId);
    section.querySelectorAll('.item').forEach(it=>{
      it.classList.remove('checked');
      delete checkedState[it.getAttribute('data-key')];
    });
    updateProgress(catId);
  }
});

tabsEl.addEventListener('click', function(e){
  const btn = e.target.closest('button');
  if(!btn) return;
  const id = btn.getAttribute('data-id');
  tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
  document.querySelectorAll('.category').forEach(sec=>{
    sec.classList.toggle('active', sec.getAttribute('data-id')===id);
  });
});

DATA.forEach(c=>updateProgress(c.id));
</script>
</body>
</html>
